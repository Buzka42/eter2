name = "eter-ai"
main = "worker.js"
compatibility_date = "2026-07-28"

# Secrets are set with `wrangler secret put` and never appear in this file:
#   GEMINI_API_KEY      the model credential
#   ETER_CLIENT_TOKEN   what the app sends as its bearer token
#
# Optional:
#   ETER_MODEL          overrides the default model

# Uncomment after `wrangler kv namespace create ETER_USAGE` to enable the
# daily cap. Without it, Google's free tier is the only ceiling — which is
# still a ceiling, and still cannot produce a bill while the project has no
# billing account attached.
# [[kv_namespaces]]
# binding = "ETER_USAGE"
# id = "..."
